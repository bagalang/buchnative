# VPS / локално: от корена на baga монорепото
#   docker compose -f app-product/buchnative/deploy/docker-compose.yml --env-file app-product/buchnative/deploy/.env up --build -d
#
# Задължително в .env: FMR_JWT_SECRET (дълъг случаен низ). Не ползвай dev-secret.
#
# rocksbaga държи данните в LSM (WAL + SST) под /data.
# network_mode: host — портовете са директно на машината (3000 / 8080 / 16579 / 5050).

name: buchnative

services:
  rocksbaga:
    container_name: buchnative-rocksbaga
    build:
      context: ../../..
      dockerfile: app-product/buchnative/deploy/Dockerfile.baga
      args:
        BAGA_ENTRY: app-product/rocksbaga/tools/serve.baga
    restart: unless-stopped
    network_mode: host
    environment:
      LSMPORT: "16579"
      # rocksbaga ползва LSMPATH като ПРЕФИКС на файл (излиза /data/rocks.wal),
      # не като директория — затова префиксът е вътре във волюма, иначе данните
      # се пишат в контейнерния слой и се губят при всяко рестартиране.
      LSMPATH: /data/rocks
    volumes:
      - rocks-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/16579'"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 40s

  backend:
    container_name: buchnative-backend
    build:
      context: ../../..
      dockerfile: app-product/buchnative/deploy/Dockerfile.baga
      args:
        BAGA_ENTRY: app-product/buchnative/backend/start.baga
        INSTALL_FONTS: "1"
    restart: unless-stopped
    network_mode: host
    depends_on:
      rocksbaga:
        condition: service_healthy
    environment:
      PORT: "8080"
      ORM_BACKEND: drock
      DROCK_HOST: "127.0.0.1"
      DROCK_PORT: "16579"
      FMR_WORKERS: "8"
      FMR_LOG: "1"
      FMR_CORS: ${FMR_CORS:-}
      FMR_JWT_SECRET: ${FMR_JWT_SECRET:?set FMR_JWT_SECRET in deploy/.env}
      FMR_JWT_TTL_SEC: ${FMR_JWT_TTL_SEC:-604800}
      FMR_TITLE: buchnative
      FMR_VERSION: "0.9.1"
      BUCHNATIVE_SIDECAR: http://127.0.0.1:5050
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  sidecar:
    container_name: buchnative-sidecar
    image: python:3.12-slim-trixie
    restart: unless-stopped
    network_mode: host
    depends_on:
      rocksbaga:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ../scripts/py:/app:ro
    environment:
      BUCHNATIVE_SIDECAR_PORT: "5050"
      # ORM_BACKEND избира dump-а: drock/rocks → kvdump.py (RESP2 SCAN),
      # иначе dump.py (PG wire, boilaDB).
      ORM_BACKEND: drock
      DROCK_HOST: "127.0.0.1"
      DROCK_PORT: "16579"
    command: ["sh", "-c", "pip install -q -r requirements.txt && python sidecar.py"]

  frontend:
    container_name: buchnative-frontend
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        BUCHNATIVE_API_PROXY: http://127.0.0.1:8080
    restart: unless-stopped
    network_mode: host
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BUCHNATIVE_API_PROXY: http://127.0.0.1:8080

volumes:
  rocks-data:
